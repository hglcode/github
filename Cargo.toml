[package]
name = "gmirror"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3          # 优化级别，3为最高优化
lto = "fat"            # 启用链接时优化
codegen-units = 1      # 代码生成单元数量
panic = "abort"        # panic时直接终止程序
strip = true           # 移除调试符号

[dependencies]
reqwest = { version = "0", features = ["stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0"
regex = "1"
